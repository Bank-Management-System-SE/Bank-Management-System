name: generate-coverage-report

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Generate coverage report
        run: |
          bash scripts/coverage.sh
          gcovr -r . --object-directory coverage --filter 'src/' --exclude 'src/main.cpp' --exclude 'src/ui.cpp' --exclude-throw-branches --exclude-unreachable-branches --txt --print-summary | tee coverage/gcovr-summary.txt
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: branch-coverage-report
          path: |
            coverage/branch-coverage.txt
            coverage/gcovr-summary.txt
