name: build-and-test
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make bms
      - name: Run unit tests
        run: make test
      - name: Generate branch coverage report
        run: bash scripts/coverage.sh || true
      - name: Upload branch coverage report
        uses: actions/upload-artifact@v4
        with:
          name: branch-coverage-report
          path: coverage/branch-coverage.txt
